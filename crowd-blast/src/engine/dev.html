<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Crowd Blast engine dev</title>
<style>
  :root { --bg: #f4f4f6; --fg: #15151a; --panel: #ffffff; --line: #d0d0d8; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #101014; --fg: #ececf2; --panel: #1b1b22; --line: #32323c; }
  }
  :root[data-theme="dark"] { --bg: #101014; --fg: #ececf2; --panel: #1b1b22; --line: #32323c; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font-family: system-ui, sans-serif; }
  body { padding: 16px; box-sizing: border-box; }
  h1 { font-size: 16px; margin: 0 0 8px; }
  #wrap { position: relative; width: min(100%, 360px); margin: 0 auto; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 360 / 640; touch-action: none; -webkit-touch-callout: none; user-select: none; border: 1px solid var(--line); }
  #bar { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
  button { font: inherit; padding: 8px 12px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; }
  pre { background: var(--panel); border: 1px solid var(--line); padding: 8px; font-size: 11px; max-height: 240px; overflow: auto; white-space: pre-wrap; margin: 8px 0 0; }
  #result { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: rgba(0,0,0,0.7); color: #fff; text-align: center; padding: 16px; box-sizing: border-box; }
  #result.show { display: flex; }
  #result button { background: #fff; color: #111; font-weight: bold; }
</style>
</head>
<body>
<h1>Crowd Blast engine: dev page (debug shapes, no theme assets)</h1>
<div id="wrap">
  <canvas id="game" width="360" height="640"></canvas>
  <div id="result">
    <div id="resultText"></div>
    <button id="replay" type="button">REPLAY</button>
  </div>
</div>
<div id="bar">
  <button id="quit" type="button">Quit run</button>
  <button id="pause" type="button">Pause</button>
  <span id="stats"></span>
</div>
<pre id="journal"></pre>

<script type="module">
import { createEngine } from './index.js';
import { debugSprites } from './render/debugSprites.js';

const canvas = document.getElementById('game');
const journal = document.getElementById('journal');
const statsEl = document.getElementById('stats');
const resultEl = document.getElementById('result');
const resultText = document.getElementById('resultText');
const pauseBtn = document.getElementById('pause');
let paused = false;

// Thème minimal en ligne : seules les couleurs et formes du repli géométrique.
const devTheme = {
  id: 'dev',
  name: 'Dev',
  palette: { skyTop: '#1b1b2f', skyBottom: '#1b1b2f', road: '#3a3a44', laneLine: '#f0e060', edge: '#222', accent: '#7ad', gateGood: '#4c9', gateBad: '#d55', danger: '#f44', text: '#fff' },
  hero: { name: 'Hero', color: '#4fb3ff', shape: 'hero' },
  ally: { name: 'Ally', color: '#8fd3ff', shape: 'ally' },
  enemies: { walker: { name: 'Walker', color: '#7bd66b', shape: 'walker' } },
  bullet: { color: '#ffe066', glow: '#fff3b0' },
};

const lines = [];
function log(msg) {
  lines.push(new Date().toISOString().slice(11, 19) + ' ' + msg);
  if (lines.length > 200) lines.shift();
  journal.textContent = lines.join('\n');
  journal.scrollTop = journal.scrollHeight;
}

const hooks = {
  onSfx(name) { if (name !== 'shot' && name !== 'kill') log('sfx ' + name); },
  onHaptic(kind) { log('haptic ' + kind); },
  onStats(s) {
    statsEl.textContent = 'dist ' + s.distanceM.toFixed(0) + ' m | crowd ' + s.crowd + ' | kills ' + s.kills + ' | speed ' + s.speed.toFixed(0);
  },
  onRunEnd(r) {
    log('onRunEnd ' + JSON.stringify(r));
    resultText.textContent = 'Run over (' + r.endedBy + ') - ' + r.distanceM.toFixed(0) + ' m, ' + r.kills + ' kills, ' + r.coinsEarned + ' coins';
    resultEl.classList.add('show');
  },
};

const engine = createEngine(canvas, debugSprites, hooks);

function newRun() {
  resultEl.classList.remove('show');
  paused = false;
  pauseBtn.textContent = 'Pause';
  const seed = Math.floor(Math.random() * 4294967296);
  log('start seed ' + seed);
  engine.start({ theme: devTheme, seed, tutorialSafeZone: true, gore: 'soft', colorblind: false, weaponId: 'starter', upgrades: { fire_rate: 0, damage: 0, crowd_start: 0, coin_magnet: 0 } });
}

document.getElementById('replay').addEventListener('click', newRun);
document.getElementById('quit').addEventListener('click', () => engine.quit());
pauseBtn.addEventListener('click', () => {
  if (paused) { engine.resume(); pauseBtn.textContent = 'Pause'; log('resume'); }
  else { engine.pause(); pauseBtn.textContent = 'Resume'; log('pause'); }
  paused = !paused;
});
window.addEventListener('error', (e) => log('error ' + e.message));

newRun();
</script>
</body>
</html>
